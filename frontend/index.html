<!DOCTYPE html>
<html>
<head>
    <title>Salary Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Salary Predictor</h1>

        <p>Enter your years of experience</p>

        <input
            type="number"
            id="experience"
            placeholder="Enter experience"
            min="0"
            step="any"
        >

        <button onclick="predictSalary()" type="button">
            Predict Salary
        </button>

        <h2 id="result"></h2>

    </div>

    <script src="./script.js"></script>

</body>
</html>
